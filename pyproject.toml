[project]
name = "more-than-scaling-bot"
version = "0.1.0"
description = "Discord.py bot with GoHighLevel-based member verification."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
